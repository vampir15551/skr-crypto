name: docs

# Builds the mkdocs site and pushes it to the `gh-pages` branch via
# `mkdocs gh-deploy`. This works on any repo — public or private,
# Pages-enabled or not. The branch is the publishing target; how it's
# *served* is your choice:
#
#   1. GitHub Pages — Settings → Pages → "Deploy from a branch" →
#      branch=gh-pages, folder=/. Free for public repos; requires
#      GitHub Pro for private.
#
#   2. Cloudflare Pages — connect via the Cloudflare GitHub App; CFP
#      polls `gh-pages` and serves the static files. Works with
#      private repos, no Pro needed. Custom domain is one click.
#
#   3. Self-host — `git clone --branch gh-pages` somewhere, point
#      Caddy / nginx at it, set up a cron to pull. The `gh-pages`
#      branch is just a static site — anything that serves a folder
#      will do.
#
# The workflow runs on every push to main + every release tag.
# `workflow_dispatch` lets you smoke-test the build manually.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needs write to push the gh-pages branch

# Allow only one concurrent docs deploy per branch / tag context.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # mkdocs gh-deploy needs the full history to push to gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Configure git for the gh-pages push
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build site (strict — fails on broken links / missing nav entries)
        run: mkdocs build --strict
      - name: Deploy to gh-pages branch
        # Only push from main and release tags; manual dispatch builds
        # but doesn't deploy (so a smoke test from a feature branch
        # can't accidentally clobber the live site).
        if: github.event_name == 'push'
        run: |
          mkdocs gh-deploy --force --strict \
            --message "docs: deploy ${{ github.sha }} from ${{ github.ref_name }}"
