name: docs

# DISABLED: GitHub Pages requires GitHub Pro for private repos.
# To re-enable, either:
#   (a) upgrade to GH Pro and revert this trigger to push: branches: [main],
#   (b) make this repo public (the docs are already free of secrets), or
#   (c) host the built `site/` from `mkdocs build` on your VPS under
#       e.g. Caddy at docs.<your-domain>.
# Keep `workflow_dispatch` so we can still smoke-test the build manually
# and so a future re-enable doesn't lose the file.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
