name: docs

# Builds the mkdocs site and publishes it. Three hosting options
# documented in `README.md` § Documentation; this workflow handles
# whichever you've enabled at the repo level:
#
#   1. GitHub Pages (default below). Requires:
#        - public repo, OR a GitHub Pro plan for private repos
#        - Settings → Pages → Source = "GitHub Actions"
#      The workflow runs on every push to main + every release tag.
#
#   2. Cloudflare Pages — set up via the Cloudflare GitHub App; CFP
#      polls the repo and runs `mkdocs build --strict` itself. No GHA
#      changes needed beyond keeping `mkdocs.yml` strict-clean.
#
#   3. Self-host — build via the `mkdocs build --strict` step below,
#      then rsync `site/` to your VPS (uncomment the `rsync` step and
#      set the `DOCS_SSH_*` repo secrets).
#
# `workflow_dispatch` lets you smoke-test the build manually whenever
# you want, regardless of the trigger choice above.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build site (strict — fails on broken links / missing nav entries)
        run: mkdocs build --strict
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # --- Self-host alternative (commented; enable if you don't use Pages) ---
      # - name: Rsync to docs host
      #   if: github.ref == 'refs/heads/main'
      #   uses: burnett01/rsync-deployments@7.0.1
      #   with:
      #     switches: -avzr --delete
      #     path: site/
      #     remote_path: /var/www/skr-crypto-docs/
      #     remote_host: ${{ secrets.DOCS_SSH_HOST }}
      #     remote_user: ${{ secrets.DOCS_SSH_USER }}
      #     remote_key:  ${{ secrets.DOCS_SSH_KEY  }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
