name: release

# Triggered on tags like v1.0.0. Builds the wheel + sdist, computes
# SHA256SUMS.txt across the artefacts, attaches all three to a GitHub
# Release, copies the matching CHANGELOG section into the release
# body. **Does not publish to PyPI** — distribution is private; consumers
# install via the wheel URL from the Release page (see RELEASING.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # for the github-release job; build is read-only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Sanity-check: tag and __version__ must agree. Otherwise users
      # would install a wheel whose `skr-crypto --version` lies. Fail loud.
      - name: Verify tag matches __version__
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="v$(python -c 'from skr_crypto.version import __version__; print(__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ $VERSION"
            exit 1
          fi

      # Produce SHA256SUMS.txt next to the artefacts. Format is the
      # canonical `<sha256>  <basename>` per line, which sha256sum -c
      # consumes directly. install-test.yml verifies it on a clean box.
      - name: Compute SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Extract the section for this version from CHANGELOG.md and use
      # it as the release body. If the section is empty, we still ship
      # — the tag itself is the source of truth — but warn loudly.
      - name: Extract changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BODY=$(awk -v v="\\[$VERSION\\]" '
            $0 ~ "^## " v { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::warning::No CHANGELOG section for $VERSION — release body will be empty"
            BODY="See CHANGELOG.md."
          fi
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: false
          # Mark non-prerelease only on stable vX.Y.Z; alphas / rcs
          # land as prerelease automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
