[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skr-crypto"
description = "USDT TRC-20 treasury — synchronous payouts service plus operator CLI in one package. Crash-safe idempotency, durable audit, on-chain reconciliation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vladimir Petrosov" }]
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["crypto", "tron", "usdt", "treasury", "payouts", "cli", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # CLI core. Click is the most boring/stable CLI lib in the ecosystem;
    # Typer is nicer but adds Pydantic v2 and tighter coupling we don't need.
    "click>=8.1,<9.0",
    # Rich for tables / colours. We keep its surface narrow (Console + Table).
    "rich>=13.7,<16.0",
    # requests for HTTP — sync, well-known, plays nicely with mocking.
    "requests>=2.31,<3.0",
    # python-dotenv: lower bound is 1.2.2 to skip CVE-2026-28684
    # (set_key follows symlinks; we use load_dotenv only, so we are
    # not exploitable, but bumping unconditionally avoids the noise
    # from pip-audit on every install).
    "python-dotenv>=1.2.2,<2.0",
]

[project.optional-dependencies]
# `pip install skr-crypto[server]` installs the FastAPI service + tronpy.
# `pip install skr-crypto`         gives the CLI alone.
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    # starlette 0.49.1 fixes CVE-2025-54121 (multipart DoS) and
    # CVE-2025-62727 (Range header quadratic CPU). FastAPI pulls
    # starlette transitively; we pin it directly so pip-audit stays
    # clean independent of FastAPI's own constraint.
    "starlette>=0.49.1",
    "tronpy==0.5.0",
    "base58==2.1.1",
    "prometheus-client>=0.21,<1.0",
    # AES-256-GCM + scrypt for the encrypted_file key provider. Pure
    # Python wheels exist for every platform; the C extensions ship
    # statically linked. No system openssl-dev required at install.
    "cryptography>=42.0,<46.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "ruff>=0.5",
    "build>=1.2",
    # Security scans — see audits/.
    "bandit>=1.7",
    "pip-audit>=2.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
# CLI binary, always installed.
skr-crypto = "skr_crypto.cli.main:main"
# Service binary, also installed regardless — runs only if the [server]
# extra was selected (it imports fastapi/tronpy, which are extras-only).
skr-crypto-server = "skr_crypto.server.__main__:main"

[project.urls]
Homepage = "https://github.com/vampir15551/skr-crypto"
Issues = "https://github.com/vampir15551/skr-crypto/issues"
Changelog = "https://github.com/vampir15551/skr-crypto/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["skr_crypto*"]

[tool.setuptools.dynamic]
version = { attr = "skr_crypto.version.__version__" }

# ---------------------------------------------------------------------------
# Test runner
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-q",
    "--tb=short",
    "--strict-markers",
]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F (pyflakes), E/W (pycodestyle), I (isort), B (bugbear), UP (pyupgrade),
# SIM (simplify), RUF (ruff-specific). No D (docstring rules) — we write
# docstrings where they add value, not as a lint requirement.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Line-too-long enforced by formatter; we don't need both.
    "E501",
    # try/except/pass for opportunistic cleanup is more readable than
    # contextlib.suppress in this codebase. Don't fight the author.
    "SIM103", "SIM105", "SIM115",
    # En-dash punctuation in prose comments is intentional.
    "RUF003",
    # Bare `raise X` without `from None` is acceptable when context
    # information would only confuse the user (e.g. mapping internal
    # exceptions to user-facing CLI errors).
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Tests use throw-away local names + nested with-statements for clarity.
"tests/**" = [
    "B007",   # `for i in range(N): ...` even if i is unused — common in tests.
    "B011",   # assert False is intentional in some tests.
    "SIM117", # nested `with patch():` reads better than combined.
]
