site_name: SKR Crypto CLI
site_description: Operator CLI for the SKR Crypto microservice fleet.
site_url: https://vampir15551.github.io/skr-crypto/
repo_url: https://github.com/vampir15551/skr-crypto
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Install: install.md
  - Commands:
      - Overview: commands/index.md
      - Lifecycle: commands/lifecycle.md
      - Inspect: commands/inspect.md
      - Configuration: commands/configuration.md
      - Backups: commands/backups.md
      - Diagnostics: commands/diagnostics.md
  - Configuration: configuration.md
  - Security: security.md
  - Releases: releases.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vampir15551/skr-crypto

# Strict mode catches broken internal links / missing nav entries on CI.
strict: true
